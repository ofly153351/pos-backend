root = "."
tmp_dir = ".tmp/air"

[build]
  cmd = "go build -o ./.tmp/air/pos-backend ./cmd/api.go"
  bin = ".tmp/air/pos-backend"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = [".git", ".cache", ".tmp", "vendor", "init-db"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
